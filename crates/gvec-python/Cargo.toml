[package]
name = "gvec-python"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python bindings for gvec, implemented in Rust with PyO3"

[lib]
name = "_gvec"
crate-type = ["cdylib"]

[dependencies]
gvec = { path = "../gvec-bindings" }
pyo3 = { version = "0.30.1", features = ["extension-module"] }
serde_json = "1"
