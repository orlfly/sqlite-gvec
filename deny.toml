[graph]
all-features = true

[bans]
deny = [
    { name = "sqlite-vec" },
    { name = "sqlite-vec-sys" },
    { name = "sqlite_graph" },
    { name = "sqlite-graph" },
    { name = "sqlitegraph" },
]

wildcards = "deny"
highlight = "all"
multiple-versions = "allow"

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []